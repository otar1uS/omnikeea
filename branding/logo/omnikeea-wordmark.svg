<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400">
  <defs>
    <linearGradient id="ok-grad" x1="0" y1="0" x2="320" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3aebc0"/>
      <stop offset="55%" stop-color="#00d9a7"/>
      <stop offset="100%" stop-color="#d97a4f"/>
    </linearGradient>
    <linearGradient id="ok-stroke" x1="0" y1="0" x2="0" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <radialGradient id="ok-glow" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Mark, sized 320x320 with 40px left/top padding -->
  <g transform="translate(40,40)">
    <rect x="9" y="9" width="302" height="302" rx="80" fill="url(#ok-grad)"/>
    <rect x="9" y="9" width="302" height="302" rx="80" fill="url(#ok-glow)" opacity="0.6"/>
    <rect x="13" y="13" width="294" height="294" rx="76" fill="none" stroke="url(#ok-stroke)" stroke-width="9"/>

    <circle cx="121" cy="160" r="64" fill="none" stroke="#ffffff" stroke-width="21" stroke-linecap="round" opacity="0.96"/>

    <g stroke="#ffffff" stroke-width="21" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M199 99 L199 221"/>
      <path d="M199 160 L253 101"/>
      <path d="M199 160 L253 219"/>
    </g>

    <circle cx="121" cy="96" r="13" fill="#ffffff" opacity="0.92"/>
  </g>

  <!-- Wordmark "Omnikeea" -->
  <text x="410" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif"
        font-size="180" font-weight="600" letter-spacing="-4" fill="#edf0f7">Omnikeea</text>
</svg>
